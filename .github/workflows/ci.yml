name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Simics image is ~10GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Build devcontainer image
        run: docker build -t simics-testdrive .devcontainer

      - name: Build modules + firmware and run simulation
        run: |
          set -o pipefail
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/workspaces/simics-testdrive -w /workspaces/simics-testdrive \
            simics-testdrive bash scripts/run.sh 2>&1 | tee sim.log

      - name: Show simulation output in job summary
        if: always()
        run: |
          {
            echo '## Simulation output'
            echo '```'
            cat sim.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-log
          path: sim.log
